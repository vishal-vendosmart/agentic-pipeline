[Service]
# Prevent privilege escalation if process is compromised
NoNewPrivileges=true

# Only allow network binding (nothing else dangerous)
CapabilityBoundingSet=CAP_NET_BIND_SERVICE

# Hide /proc access to other processes (reduces info leakage)
ProtectProc=invisible

# Hide kernel controls from the service
ProtectKernelTunables=true
ProtectKernelModules=true
